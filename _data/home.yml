hero:
  about:
    - 'I''m a master''s student in Electrical and Computer Engineering at UCLA and a student researcher at <a href="https://vail.cs.ucla.edu/" target="_blank" rel="noopener">VAIL</a>, working with <span class="nobr">Prof. <a href="https://boleizhou.github.io/" target="_blank" rel="noopener">Bolei Zhou</a>.</span>'
