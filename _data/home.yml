# Work, reverse-chronological. Every card has the same shape:
#   clip (key into _data/media.yml) or tile (a few words set in type on a soft tint of `hue`;
#   no stock images, no people),
#   title, meta (org · role · dates, one line), line (one sentence), venue (optional), links.
# A link whose url starts with "/" is internal (arrow icon, same tab).
work:
  - title: "ChairNav"
    meta: ["VAIL, UCLA", "First author", "Jan 2026 – Present"]
    line: "A power wheelchair that learns to drive long outdoor routes from a delivery robot's driving data and its rider's corrections; I built the cross-embodiment data pipeline and worked on the chair's hardware and onboard software."
    clip: chairnav-nav-2x
    links:
      - { label: "Project", url: "https://vail.cs.ucla.edu/ChairNav/" }
      - { label: "Paper", url: "https://arxiv.org/abs/2610.24012" }
      - { label: "Drive the model", url: "/play/wheelchair/" }

  - title: "Cue the Flow"
    meta: ["VAIL, UCLA", "Co-author", "2026"]
    line: "Steering flow-matching policies for open-world delivery; I integrated the robot arm on a quadruped and deployed the models through a Jetson bridge to remote inference."
    clip: cue-outdoor-delivery-2
    venue: "CoRL 2026"
    links:
      - { label: "Project", url: "https://hatchetproject.github.io/delivery_steer/" }
      - { label: "Paper", url: "https://arxiv.org/abs/2609.38989" }

  - title: "Gaze → wheelchair goal"
    meta: ["VAIL, UCLA", "Student Researcher", "2026"]
    line: "Look at a spot on the floor, pinch to confirm: turning Meta Aria Gen 2 eye gaze and hand tracking into a goal for the wheelchair, so far tested offline with one wearer."
    clip: aria-gaze-target

  - title: "ToolSmith"
    meta: ["UCLA NLP Group", "Prof. Kai-Wei Chang", "Dec 2025 – Mar 2026"]
    line: "Co-developed a framework that writes and verifies reusable Python tools from failed runs of multimodal search agents."
    tile: "Multimodal search agents"
    hue: 215
    venue: "Findings of EMNLP 2026"
    links:
      - { label: "Project", url: "https://threesr.github.io/toolsmith/" }

  - title: "Seizure-Semiology-Suite (S3)"
    meta: ["Seizure Lab, ECE, UCLA", "Student Researcher", "Aug – Oct 2025"]
    line: "Built a clinical seizure-semiology dataset and served three vision-language models with vLLM, contributing to the S3 benchmark."
    tile: "Clinical multimodal data"
    hue: 150
    venue: "ICML 2026 Spotlight"
    links:
      - { label: "Paper", url: "https://arxiv.org/abs/2605.21852" }

  - title: "Acoustic highlighting & co-speech gestures"
    meta: ["University of Rochester", "Prof. Chenliang Xu", "2024 – 2025"]
    line: "First author of a paper on vision-language-guided acoustic highlighting; earlier, worked on co-speech gesture generation for GestureLSM."
    tile: "Audio & gesture"
    hue: 28
    links:
      - { label: "Acoustic highlighting", url: "https://arxiv.org/abs/2601.08871" }
      - { label: "GestureLSM", url: "https://arxiv.org/abs/2501.18898" }

  - title: "Image generation from skeletons"
    meta: ["University of Rochester", "Prof. Jiebo Luo", "2024 – 2025"]
    line: "Generated animal images from skeletons with Stable Diffusion and preference optimization; contributed to a Video-LMM survey."
    tile: "Skeletons to images"
    hue: 345
    links:
      - { label: "Video-LMM survey", url: "https://arxiv.org/abs/2510.05034" }

  - title: "City-scale Gaussian Splatting"
    meta: ["Farsee2 Technology", "ML Intern", "Jul – Sep 2024"]
    line: "Reduced floating artifacts in city-scale reconstructions with incidence-angle weighting and depth/normal supervision, and spread preprocessing across machines."
    tile: "3D reconstruction"
    hue: 262

