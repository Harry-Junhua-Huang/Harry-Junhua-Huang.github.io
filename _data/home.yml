# num + optional unit (rendered smaller, in sans). def = the tap/hover definition (optional).
stats:
  - num: "84.9%"
    label: "autonomous driving time · 7.8 km outdoor"
    def: "ChairNav post-training policy: share of driving time across 4 outdoor drives (116.2 of 136.9 min). Not a task success rate."
  - num: "0.6 → 20"
    unit: "Hz"
    label: "model inference on Jetson AGX Orin"
    def: "ChairNav model, after quantization and TensorRT. Model inference rate, not the full control loop (the paper's deployment runs the model at 10 Hz)."
  - num: "9"
    unit: "platforms"
    label: "5 robots · 2 Aria glasses · 2 Jetsons"

# One line under the stats (replaces the old Platforms section).
platforms: "Permobil M3 · AgileX PiPER · DEEP Robotics M20 Pro · Booster T1 · Unitree Go2 · Meta Aria Gen 1 & 2 · Jetson AGX Orin · Jetson Xavier NX"

reel:
  feature:
    clip: chairnav-mid-vs-post
    title: "Same gatepost, two policies"
    note: "Matched by route position, not time. Mid-training, the rider has to correct; after human-in-the-loop post-training, the chair passes on its own."
  tiles:
    - clip: chairnav-hardware
      title: "The ChairNav wheelchair"
    - clip: cue-mobile-base-demo
      title: "Cue-conditioned manipulation"
    - clip: aria-wall-targets
      title: "Gaze on targets 3–8 m away"

systems:
  - id: wheelchair
    kicker: "ChairNav · VAIL, UCLA"
    title: "Wheelchair autonomy stack"
    line: "Reverse-engineered the R-net CAN interface, identified the chair's dynamics, and sped up ChairNav model inference on the Jetson from 0.6 to 20 Hz."
    links:
      - { label: "Project page", url: "https://vail.cs.ucla.edu/ChairNav/" }
      - { label: "Paper", url: "https://arxiv.org/abs/2610.24012" }
    widget: true
  - id: quadruped
    kicker: "Cue the Flow · CoRL 2026"
    title: "Quadruped mobile manipulation"
    line: "A PiPER arm on a DEEP Robotics M20 Pro: I integrated the arm, power, comms and streaming, deployed a frozen π0.5 VLA through a Jetson bridge to remote inference, and built semi-automated demo collection."
    links:
      - { label: "Project page", url: "https://hatchetproject.github.io/delivery_steer/" }
      - { label: "Paper", url: "https://arxiv.org/abs/2609.38989" }
    clip: cue-outdoor-delivery-2
  - id: gaze
    kicker: "Meta Aria Gen 2 · VAIL, UCLA"
    title: "Gaze → wheelchair goal"
    line: "Can a glance at the floor give a wheelchair its goal? Aria Gen 2 eye gaze + VIO, checked against AprilTag ground truth."
    figures:
      - { num: "0.1–0.25 m", label: "floor-goal error at 1.5–4 m" }
      - { num: "1.6–2.0°", label: "gaze error p50 (was 2.7–3.0°)" }
      - { num: "1 / 5.4 min", label: "false confirms, natural use (naive pinch: ~100)" }
    caveat: "5-pt calibration · 1 wearer, 1 day, chair parked · range = gaze ray ∩ floor (≤ 5 m), not the glasses' depth · analysed offline"
    clip: aria-gaze-target
    wide: true

